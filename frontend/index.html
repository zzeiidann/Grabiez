<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00a86b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Grabiez Fare</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ3ynhHDYC0lMn3ZxZ7nDraM3iw1p8I="
      crossorigin=""
    />
    <link rel="stylesheet" href="/assets/styles.css?v=10" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <span class="eyebrow">GRABIEZ</span>
          <h1>Where to?</h1>
        </div>
        <button class="location-button" id="locateButton" aria-label="Gunakan lokasi saya">⌖</button>
      </header>

      <section class="search-card" aria-label="Pilih perjalanan">
        <div class="route-line" aria-hidden="true">
          <span class="dot pickup-dot"></span>
          <span class="line"></span>
          <span class="dot destination-dot"></span>
        </div>

        <div class="search-fields">
          <div class="field-wrap">
            <label for="pickupInput">Titik berangkat</label>
            <div class="field-row">
              <input id="pickupInput" autocomplete="off" placeholder="Cari lokasi penjemputan" />
              <button class="search-action" data-target="pickup">Cari</button>
            </div>
            <div class="results" id="pickupResults"></div>
          </div>

          <div class="field-divider"></div>

          <div class="field-wrap">
            <label for="destinationInput">Tujuan</label>
            <div class="field-row">
              <input id="destinationInput" autocomplete="off" placeholder="Mau pergi ke mana?" />
              <button class="search-action" data-target="destination">Cari</button>
            </div>
            <div class="results" id="destinationResults"></div>
          </div>
        </div>
      </section>

      <section class="map-wrap">
        <div id="map" aria-label="Peta rute"></div>
        <div class="map-hint" id="mapHint">Cari lokasi atau tap peta untuk memilih titik berangkat</div>
      </section>

      <section class="bottom-sheet">
        <div class="drag-handle"></div>
        <div class="trip-summary hidden" id="tripSummary">
          <div>
            <span class="summary-label">Rute terbaik</span>
            <strong id="routeSummary">—</strong>
          </div>
          <div class="weather-chips" id="weatherChips"></div>
        </div>

        <div class="status" id="status">Pilih titik berangkat dan tujuan untuk melihat estimasi.</div>
        <div class="tier-list" id="tierList"></div>

        <button class="estimate-button" id="estimateButton" disabled>
          <span>Lihat estimasi harga</span>
          <span aria-hidden="true">→</span>
        </button>

      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/assets/app.js?v=10"></script>
  </body>
</html>
